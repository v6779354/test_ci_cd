<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Время сервера</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card: #fffdf8;
    --text: #1f1d1a;
    --muted: #6f6a60;
    --line: #e4dfd3;
    --accent: #c2541c;
    --ok: #2f7d4f;
    --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151412;
      --card: #1e1c19;
      --text: #f1ede4;
      --muted: #9b958a;
      --line: #322f2a;
      --accent: #f08a4b;
      --ok: #5cc28a;
      --err: #f2827a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    grid-template-columns: minmax(0, 560px);
    place-content: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%;
    min-width: 0;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: clamp(20px, 6vw, 32px) clamp(16px, 6vw, 28px) 24px;
    box-shadow: 0 10px 40px rgb(0 0 0 / 0.06);
  }
  .label {
    margin: 0;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .clock {
    margin: 8px 0 4px;
    font-size: clamp(56px, 16vw, 88px);
    font-weight: 600;
    line-height: 1;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .clock .sec { color: var(--accent); }
  .date {
    margin: 0;
    font-size: 20px;
    color: var(--muted);
  }
  .date::first-letter { text-transform: uppercase; }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin: 28px 0 20px;
  }
  .tile {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .tile .value {
    margin-top: 2px;
    font-size: 20px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .year .bar {
    height: 8px;
    margin-top: 8px;
    border-radius: 4px;
    background: var(--line);
    overflow: hidden;
  }
  .year .fill {
    height: 100%;
    width: 0;
    background: var(--accent);
    transition: width 0.6s ease;
  }
  .year { margin-bottom: 20px; }
  .year .row {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: var(--muted);
  }
  .converter {
    margin-bottom: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
  }
  .converter h2 {
    margin: 0 0 12px;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .fields {
    display: grid;
    grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
    gap: 12px;
  }
  .field span {
    display: block;
    margin-bottom: 4px;
    font-size: 13px;
    color: var(--muted);
  }
  .field input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
    font-size: 17px;
    font-variant-numeric: tabular-nums;
  }
  .field input:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
    border-color: transparent;
  }
  .result {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 12px;
    min-height: 56px;
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 12px;
    background: var(--bg);
  }
  .result .big {
    font-size: 32px;
    font-weight: 600;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .result .meta { font-size: 14px; color: var(--muted); }
  .result .shift {
    padding: 1px 8px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--card);
    font-size: 13px;
    font-weight: 600;
  }
  .result.err { color: var(--err); font-size: 15px; align-items: center; }
  @media (max-width: 420px) {
    .fields { grid-template-columns: minmax(0, 1fr); }
  }
  footer {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 14px;
    color: var(--muted);
  }
  .status::before {
    content: "";
    display: inline-block;
    width: 8px;
    height: 8px;
    margin-right: 6px;
    border-radius: 50%;
    background: var(--muted);
    vertical-align: 1px;
  }
  .status.ok::before { background: var(--ok); }
  .status.err { color: var(--err); }
  .status.err::before { background: var(--err); }
  footer a { color: inherit; }
  footer a + a { margin-left: 12px; }
</style>
</head>
<body>
  <main class="card">
    <p class="label">Время сервера</p>
    <div class="clock" id="clock">--:--<span class="sec">:--</span></div>
    <p class="date" id="date">&nbsp;</p>

    <div class="grid">
      <div class="tile">
        <div class="label">Часовой пояс</div>
        <div class="value" id="tz">—</div>
      </div>
      <div class="tile">
        <div class="label">UTC</div>
        <div class="value" id="utc">—</div>
      </div>
      <div class="tile">
        <div class="label">Неделя ISO</div>
        <div class="value" id="week">—</div>
      </div>
      <div class="tile">
        <div class="label">День года</div>
        <div class="value" id="doy">—</div>
      </div>
    </div>

    <div class="year">
      <div class="row"><span>Прогресс года</span><span id="year-pct">—</span></div>
      <div class="bar"><div class="fill" id="year-fill"></div></div>
    </div>

    <section class="converter">
      <h2>Конвертер из UTC</h2>
      <div class="fields">
        <label class="field">
          <span>Время UTC</span>
          <input type="time" id="conv-time" required>
        </label>
        <label class="field">
          <span>Город или часовой пояс</span>
          <input type="text" id="conv-tz" list="cities" value="Екатеринбург"
                 placeholder="Москва, New York, MSK…" autocomplete="off" spellcheck="false">
        </label>
      </div>
      <datalist id="cities"></datalist>
      <div class="result" id="conv-result" aria-live="polite"></div>
    </section>

    <footer>
      <span class="status" id="status">Подключение…</span>
      <span><a href="/datetime">JSON</a><a href="/docs">API</a></span>
    </footer>
  </main>

<script>
  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");

  // Разница между часами сервера и браузера и смещение пояса сервера от UTC (мс).
  let clockOffset = null;
  let tzOffset = 0;
  let tzName = "";
  let lastDayKey = "";

  function parseTzOffset(iso) {
    const m = iso.match(/([+-])(\d{2}):(\d{2})$/);
    if (!m) return 0;
    const ms = (Number(m[2]) * 60 + Number(m[3])) * 60000;
    return m[1] === "-" ? -ms : ms;
  }

  async function sync() {
    try {
      const sent = Date.now();
      const [time, dt] = await Promise.all([
        fetch("/time").then((r) => r.json()),
        fetch("/datetime").then((r) => r.json()),
      ]);
      const received = Date.now();
      clockOffset = time.timestamp * 1000 - (sent + received) / 2;
      tzOffset = parseTzOffset(time.local);
      tzName = dt.timezone;
      lastDayKey = "";
      const status = $("status");
      status.className = "status ok";
      status.textContent = "Синхронизировано " + new Date().toLocaleTimeString("ru-RU");
    } catch (e) {
      const status = $("status");
      status.className = "status err";
      status.textContent = "Сервер недоступен";
    }
  }

  async function refreshDate() {
    try {
      const d = await fetch("/date").then((r) => r.json());
      $("week").textContent = d.iso_week;
      $("doy").textContent = d.day_of_year;
    } catch (e) {}
  }

  function render() {
    if (clockOffset === null) return;
    const nowUtc = new Date(Date.now() + clockOffset);
    // Сдвигаем на пояс сервера и читаем через UTC-геттеры, чтобы не зависеть от пояса браузера.
    const local = new Date(nowUtc.getTime() + tzOffset);

    $("clock").innerHTML =
      pad(local.getUTCHours()) + ":" + pad(local.getUTCMinutes()) +
      '<span class="sec">:' + pad(local.getUTCSeconds()) + "</span>";
    $("utc").textContent = pad(nowUtc.getUTCHours()) + ":" + pad(nowUtc.getUTCMinutes());

    const h = Math.trunc(Math.abs(tzOffset) / 3600000);
    const m = Math.round((Math.abs(tzOffset) % 3600000) / 60000);
    const sign = tzOffset < 0 ? "−" : "+";
    $("tz").textContent = tzName + " (" + sign + pad(h) + ":" + pad(m) + ")";

    const dayKey = local.toISOString().slice(0, 10);
    if (dayKey !== lastDayKey) {
      lastDayKey = dayKey;
      $("date").textContent = local.toLocaleDateString("ru-RU", {
        weekday: "long", day: "numeric", month: "long", year: "numeric", timeZone: "UTC",
      });
      refreshDate();
    }

    const y = local.getUTCFullYear();
    const start = Date.UTC(y, 0, 1);
    const pct = ((local.getTime() - start) / (Date.UTC(y + 1, 0, 1) - start)) * 100;
    $("year-pct").textContent = pct.toFixed(1).replace(".", ",") + " %";
    $("year-fill").style.width = pct + "%";
  }

  // Конвертер: пересчитывает при каждом изменении полей.
  const convTime = $("conv-time");
  const convTz = $("conv-tz");
  const convResult = $("conv-result");
  let convTimer = null;
  let convRequest = 0;

  function dayShiftLabel(n) {
    if (n === 0) return "";
    const abs = Math.abs(n);
    const word = abs === 1 ? "день" : abs < 5 ? "дня" : "дней";
    return (n > 0 ? "+" : "−") + abs + " " + word;
  }

  async function convert() {
    const time = convTime.value;
    const tz = convTz.value.trim();
    if (!time || !tz) {
      convResult.className = "result";
      convResult.textContent = "";
      return;
    }
    const id = ++convRequest;
    try {
      const params = new URLSearchParams({ time, tz });
      const response = await fetch("/convert?" + params);
      const data = await response.json();
      if (id !== convRequest) return;
      if (!response.ok) {
        convResult.className = "result err";
        convResult.textContent = typeof data.detail === "string" ? data.detail : "Некорректный запрос";
        return;
      }
      convResult.className = "result";
      convResult.innerHTML = "";
      const big = document.createElement("span");
      big.className = "big";
      big.textContent = data.time;
      const meta = document.createElement("span");
      meta.className = "meta";
      meta.textContent = data.timezone + " · UTC" + data.utc_offset;
      convResult.append(big, meta);
      const shift = dayShiftLabel(data.day_shift);
      if (shift) {
        const badge = document.createElement("span");
        badge.className = "shift";
        badge.textContent = shift;
        convResult.append(badge);
      }
    } catch (e) {
      if (id !== convRequest) return;
      convResult.className = "result err";
      convResult.textContent = "Сервер недоступен";
    }
  }

  function scheduleConvert() {
    clearTimeout(convTimer);
    convTimer = setTimeout(convert, 200);
  }

  async function loadCities() {
    try {
      const cities = await fetch("/timezones").then((r) => r.json());
      const list = $("cities");
      for (const city of cities) {
        const option = document.createElement("option");
        option.value = city.name;
        option.label = "UTC" + city.utc_offset;
        list.append(option);
      }
    } catch (e) {}
  }

  convTime.addEventListener("input", scheduleConvert);
  convTz.addEventListener("input", scheduleConvert);
  loadCities();

  sync().then(() => {
    render();
    const nowUtc = new Date(Date.now() + (clockOffset ?? 0));
    convTime.value = pad(nowUtc.getUTCHours()) + ":" + pad(nowUtc.getUTCMinutes());
    convert();
  });
  setInterval(render, 250);
  setInterval(sync, 60000);
</script>
</body>
</html>
